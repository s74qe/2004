.cell img{width:100%;height:100%;object-fit:fill;display:block}
.cell span{position:absolute;bottom:0;transform:translateX(-50%);height:15cqw;padding:0 2.5cqw;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink);font-weight:bold;font-size:11cqw;white-space:nowrap;line-height:1}

var grid=document.getElementById("grid"),win=document.getElementById("win");
CHARS.forEach(function(ch,idx){
  var c=document.createElement("div");c.className="cell";c.style.setProperty("--i",idx);
  var im=new Image();im.src=ch[1];im.alt=ch[0];c.appendChild(im);
  var s=document.createElement("span");s.textContent=ch[0];
  s.style.left=(ch[2]+ch[4]/2).toFixed(2)+"%";s.style.minWidth=(ch[4]+2.5).toFixed(2)+"%";
  c.appendChild(s);grid.appendChild(c);
});
var stage=document.getElementById("stage");
function swap(openIt){
  var from=stage.offsetHeight;
  stage.style.height=from+"px";
  if(openIt)win.classList.add("open");else{win.classList.remove("open");grid.scrollTop=0}
  stage.style.height="auto";var to=stage.offsetHeight;
  stage.style.height=from+"px";stage.offsetHeight;
  stage.style.height=to+"px";
  setTimeout(function(){stage.style.height=""},520);
}
function openG(){swap(true)}
function closeG(){swap(false)}
document.getElementById("open").onclick=openG;
document.getElementById("back").onclick=closeG;
document.getElementById("x").onclick=closeG;
